name: Publish VS Code Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - run: npm run lint --if-present
      - run: npm run test --if-present

      - name: Package
        run: npx --yes @vscode/vsce@latest package --allow-proposed-apis inlineCompletionsAdditions -o extension.vsix

      - name: Publish to Marketplace
        run: npx --yes @vscode/vsce@latest publish --packagePath extension.vsix --skip-duplicate --allow-proposed-apis inlineCompletionsAdditions

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension.vsix
